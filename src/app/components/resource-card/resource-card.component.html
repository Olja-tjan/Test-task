@if (resource) {
<div class="resource-card">
  <div class="resource-card__color" [style.background-color]="resource.color"></div>
  <div class="resource-card__info">
    <h3 class="resource-card__name">{{ resource.name }}</h3>
    <p class="resource-card__year">Year: {{ resource.year }}</p>
    <p class="resource-card__pantone">Pantone: {{ resource.pantone_value }}</p>
  </div>
</div>
}
