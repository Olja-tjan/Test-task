@if (user) {
<div class="user-info">
  <div class="user-info__wrapper">
    <img class="user-info__image" [src]="user.data.avatar" alt="avatar">
    <div class="user-info__info">
      <h3 class="user-info__name">{{ user.data.first_name }} {{ user.data.last_name }}</h3>
      <p class="user-info__email">{{ user.data.email }}</p>
    </div>
  </div>
  <a class="user-info__link" [href]="user.support.url">Link: {{ user.support.url }}</a>
  <p class="user-info__text">{{user.support.text}}</p>
  <button class="user-info__edit">Edit</button>
</div>
}
