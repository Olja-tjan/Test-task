@if (user) {
<div class="user-info">
  <div class="user-info__wrapper">
    <img class="user-info__image" [src]="user.avatar" alt="avatar">
    <div class="user-info__info">
      <h3 class="user-info__name">{{ user.first_name }} {{ user.last_name }}</h3>
      <p class="user-info__email">{{ user.email }}</p>
    </div>
  </div>
  <a class="user-info__support" [href]="user.support?.url">Support: {{ user.support?.url }}</a>
  <p class="user-info__text">{{user.text}}</p>
  <button class="user-info__edit">Edit</button>
</div>
}
